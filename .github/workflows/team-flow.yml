# Generated draft. Preserve existing checks when integrating.
"name": "Team Flow"
"on":
  "pull_request":
    "branches":
      - "main"
  "push":
    "branches":
      - "main"
  "merge_group":
    "types":
      - "checks_requested"
  "workflow_dispatch": {}
"permissions":
  "contents": "read"
"jobs":
  "verify":
    "name": "team-flow-verify"
    "runs-on": "ubuntu-latest"
    "timeout-minutes": 5
    "steps":
      -
        "name": "Checkout integration candidate"
        "uses": "actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803"
        "with":
          "persist-credentials": false
      -
        "name": "classroom-integration"
        "run": "python3 -m unittest discover -s tests -v"
        "shell": "bash"
