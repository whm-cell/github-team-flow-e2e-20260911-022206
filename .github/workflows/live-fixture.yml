name: Live test fixture writer
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Controlled synthetic fixture operation
        required: true
        type: choice
        options:
          - bad-contract
          - good-contract
          - adopt-client
          - sync-client
          - adopt-revert
permissions:
  contents: write
  pull-requests: write
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Apply a fixed test fixture as the GitHub Actions actor
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_MODE: ${{ inputs.mode }}
        run: python3 scripts/live_fixture.py
